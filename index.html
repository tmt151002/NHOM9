<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 820" width="100%" height="100%" style="background:#f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Connecting Lines -->
  <!-- To Branch 1 (Top Left) -->
  <path d="M 740 400 C 520 400, 520 180, 360 180" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5 3"/>
  <!-- To Branch 2 (Top Right) -->
  <path d="M 740 400 C 960 400, 960 180, 1120 180" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5 3"/>
  <!-- To Branch 3 (Bottom Left) -->
  <path d="M 740 400 C 520 400, 520 620, 360 620" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="5 3"/>
  <!-- To Branch 4 (Bottom Right) -->
  <path d="M 740 400 C 960 400, 960 620, 1120 620" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="5 3"/>

  <!-- Center Node -->
  <g filter="url(#shadow)">
    <rect x="560" y="350" width="360" height="100" rx="16" fill="#1e293b"/>
    <text x="740" y="392" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">CHẾ ĐỘ MIỄN GIẢM TIẾT DẠY</text>
    <text x="740" y="422" text-anchor="middle" fill="#94a3b8" font-size="16">Thông tư 05/2025/TT-BGDĐT</text>
  </g>

  <!-- Node 1: Kiêm nhiệm chuyên môn -->
  <g filter="url(#shadow)">
    <rect x="40" y="40" width="640" height="280" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="40" y="40" width="640" height="48" rx="14" fill="#eff6ff"/>
    <text x="65" y="72" fill="#1d4ed8" font-size="20" font-weight="bold">1. KIÊM NHIỆM CHUYÊN MÔN</text>
    
    <text x="65" y="125" fill="#334155" font-size="18">• <tspan font-weight="bold">GV Chủ nhiệm (Mọi cấp):</tspan> Giảm <tspan fill="#2563eb" font-weight="bold">4 tiết/tuần</tspan></text>
    <text x="65" y="165" fill="#334155" font-size="18">• <tspan font-weight="bold">Tổ trưởng CM / Bộ môn / QL học sinh:</tspan> Giảm <tspan fill="#2563eb" font-weight="bold">3 tiết/tuần</tspan></text>
    <text x="65" y="205" fill="#334155" font-size="18">• <tspan font-weight="bold">Tổ phó CM / Bộ môn / QL học sinh:</tspan> Giảm <tspan fill="#2563eb" font-weight="bold">1 tiết/tuần</tspan></text>
    <text x="82" y="245" fill="#64748b" font-size="16">*(Áp dụng cả trường PTDT nội trú, bán trú)*</text>
  </g>

  <!-- Node 2: Công tác Đảng - Đoàn thể -->
  <g filter="url(#shadow)">
    <rect x="800" y="40" width="640" height="280" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <rect x="800" y="40" width="640" height="48" rx="14" fill="#fef2f2"/>
    <text x="825" y="72" fill="#b91c1c" font-size="20" font-weight="bold">2. CÔNG TÁC ĐẢNG &amp; ĐOÀN THỂ</text>
    
    <text x="825" y="120" fill="#334155" font-size="18">• <tspan font-weight="bold">Bí thư Đảng bộ / Chi bộ:</tspan></text>
    <text x="845" y="152" fill="#475569" font-size="17">- Trường Hạng 1: Giảm <tspan fill="#dc2626" font-weight="bold">4 tiết/tuần</tspan> | Khác: Giảm <tspan fill="#dc2626" font-weight="bold">3 tiết/tuần</tspan></text>
    <text x="825" y="190" fill="#334155" font-size="18">• <tspan font-weight="bold">Phó Bí thư / CT HĐT / Thư ký HĐT:</tspan> Giảm <tspan fill="#dc2626" font-weight="bold">2 tiết/tuần</tspan></text>
    <text x="825" y="228" fill="#334155" font-size="18">• <tspan font-weight="bold">Công đoàn:</tspan> Theo quy định TT 08/2016/TT-BGDĐT</text>
    <text x="825" y="266" fill="#334155" font-size="18">• <tspan font-weight="bold">Đoàn - Đội (Bí thư, TPT Đội):</tspan> Hiệu trưởng quy định</text>
  </g>

  <!-- Node 3: Vị trí việc làm khác -->
  <g filter="url(#shadow)">
    <rect x="40" y="480" width="640" height="280" rx="14" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <rect x="40" y="480" width="640" height="48" rx="14" fill="#ecfdf5"/>
    <text x="65" y="512" fill="#047857" font-size="20" font-weight="bold">3. VỊ TRÍ VIỆC LÀM KHÁC (QUY ĐỊNH MỚI)</text>
    
    <text x="65" y="560" fill="#334155" font-size="18">• <tspan font-weight="bold">Văn thư, Thư viện, CNTT, Hỗ trợ KT:</tspan> Giảm <tspan fill="#059669" font-weight="bold">3 tiết/tuần</tspan></text>
    <text x="65" y="600" fill="#334155" font-size="18">• <tspan font-weight="bold">Giáo vụ, Tư vấn học sinh:</tspan> HT cân đối theo quỹ trần:</text>
    <text x="82" y="635" fill="#475569" font-size="17">- Trường quy mô lớn: Tối đa <tspan fill="#059669" font-weight="bold">8 tiết/tuần</tspan> (cả trường)</text>
    <text x="82" y="668" fill="#475569" font-size="17">- Trường còn lại: Tối đa <tspan fill="#059669" font-weight="bold">4 tiết/tuần</tspan> (cả trường)</text>
  </g>

  <!-- Node 4: Đối tượng đặc thù -->
  <g filter="url(#shadow)">
    <rect x="800" y="480" width="640" height="280" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="800" y="480" width="640" height="48" rx="14" fill="#f5f3ff"/>
    <text x="825" y="512" fill="#6d28d9" font-size="20" font-weight="bold">4. ĐỐI TƯỢNG ĐẶC THÙ KHÁC</text>
    
    <text x="825" y="560" fill="#334155" font-size="18">• <tspan font-weight="bold">Nuôi con nhỏ &lt; 12 tháng:</tspan> Giảm <tspan fill="#7c3aed" font-weight="bold">3 tiết/tuần</tspan></text>
    <text x="845" y="592" fill="#64748b" font-size="16">*(Áp dụng cho nữ hoặc nam nuôi con một mình)*</text>
    <text x="825" y="630" fill="#334155" font-size="18">• <tspan font-weight="bold">Thời gian tập sự:</tspan> Giảm <tspan fill="#7c3aed" font-weight="bold">2 tiết/tuần</tspan></text>
    <text x="825" y="668" fill="#334155" font-size="18">• <tspan font-weight="bold">Trường chuyên biệt / Khuyết tật:</tspan></text>
    <text x="845" y="700" fill="#475569" font-size="17">Áp dụng <tspan font-weight="bold">định mức tiết chuẩn thấp hơn</tspan> trường thường</text>
  </g>
</svg>
